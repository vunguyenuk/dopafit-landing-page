  const droppedSignatures = new Set(["div||","div||","div||","div||","div||","div||","div||","div||","div||","div||","div||Hover a frame","div||Create a free website with Framer, the website builder loved by startups, design"]);
  const droppedShapes = new Set([]);
  const totalBlocks = 13;
  const offsetStyle = document.createElement("style");
  offsetStyle.id = "capture-studio-offset";
  const basePadding = new Map();
  let collapsed = [];
  let scheduled = false;

  let changed = false;
  const isHidden = (node) => node.getAttribute("data-capture-studio-hidden") === "true";
  function setFlag(node, attribute, on) {
    if (on === (node.getAttribute(attribute) === "true")) return;
    if (on) node.setAttribute(attribute, "true");
    else node.removeAttribute(attribute);
    changed = true;
  }

  // A framework re-render drops our stamps. Hide only what can be positively
  // recognised as removed: a block that reappears is a small annoyance, a page
  // that vanishes is not.
  function isDropped(node, index, byPosition) {
    const id = node.getAttribute("data-cs-block");
    if (id) return droppedIds.has(id);
    if (byPosition) return droppedIndexes.has(index);
    return droppedSignatures.has(csSignature(node)) || droppedShapes.has(csShape(node));
  }

  // Removing the first block under a pinned header would slide the next one
  // underneath it, so give that block room.
  const isPinned = (node) => {
    const position = getComputedStyle(node).position;
    return position === "fixed" || position === "sticky";
  };
  function offsetUnderPinnedHeader(blocks) {
    const visible = blocks.filter((node) => !isHidden(node));
    const pinned = visible.filter((node) => isPinned(node) && node.getBoundingClientRect().top <= 4);
    const first = visible.find((node) => !pinned.includes(node));
    // Only when the block that used to sit under the header was removed;
    // a hero designed to run beneath a transparent header stays as it is.
    const originalFirst = blocks.find((node) => !isPinned(node));
    let css = "";
    if (pinned.length && first && first !== originalFirst) {
      const height = Math.round(Math.max(...pinned.map((node) => node.getBoundingClientRect().height)));
      if (height > 0) {
        const key = first.getAttribute("data-cs-block") || csSignature(first);
        if (!basePadding.has(key)) {
          offsetStyle.disabled = true;
          basePadding.set(key, getComputedStyle(first).paddingTop || "0px");
          offsetStyle.disabled = false;
        }
        setFlag(first, "data-cs-first", true);
        css = '[data-cs-first="true"]{padding-top:calc(' + basePadding.get(key) + ' + ' + height + 'px)!important;scroll-margin-top:' + height + 'px}';
      }
    }
    for (const node of document.querySelectorAll('[data-cs-first="true"]')) if (node !== first) setFlag(node, "data-cs-first", false);
    if (offsetStyle.textContent !== css) offsetStyle.textContent = css;
    if (!offsetStyle.isConnected && document.head) document.head.appendChild(offsetStyle);
  }

  function applySelection() {
    scheduled = false;
    // Wrappers collapsed last time are re-evaluated from scratch, so one bad
    // moment during hydration can never hide the page for good.
    const previouslyCollapsed = collapsed;
    collapsed = [];
    for (const node of previouslyCollapsed) node.removeAttribute("data-capture-studio-hidden");

    const blocks = csBlocks();
    if (!blocks.length) return;
    const byPosition = blocks.length === totalBlocks;
    const parents = new Set();
    blocks.forEach((node, index) => {
      setFlag(node, "data-capture-studio-hidden", isDropped(node, index, byPosition));
      if (node.parentElement) parents.add(node.parentElement);
    });

    // A wrapper holding nothing but removed blocks collapses too, for as long
    // as that stays true.
    for (const parent of parents) {
      let node = parent;
      while (node && node !== document.body && node !== document.documentElement) {
        const children = [...node.children].filter((child) => !CS_SKIP.has(csTag(child)));
        if (!children.length || children.some((child) => !isHidden(child))) break;
        node.setAttribute("data-capture-studio-hidden", "true");
        collapsed.push(node);
        node = node.parentElement;
      }
    }
    if (collapsed.length !== previouslyCollapsed.length || collapsed.some((node, index) => node !== previouslyCollapsed[index])) changed = true;
    offsetUnderPinnedHeader(blocks);
    // Scroll-linked libraries (GSAP ScrollTrigger, Lenis, Framer) cache section
    // positions; tell them the layout moved, but only when it really did.
    if (changed) {
      changed = false;
      setTimeout(() => window.dispatchEvent(new Event("resize")), 0);
    }
  }

  function schedule() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(applySelection);
  }

  new MutationObserver(schedule).observe(document.documentElement, { childList: true, subtree: true });
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", applySelection, { once: true });
  else applySelection();
  window.addEventListener("load", applySelection, { once: true });
})();
</script></body></html>
